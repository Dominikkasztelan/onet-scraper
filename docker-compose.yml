services:
  tor:
    image: osminogin/tor-simple:latest
    container_name: onet-tor
    ports:
      - "9050:9050"
      - "9051:9051"
    environment:
      - TOR_Log=notice stdout
      - TOR_ControlPort=0.0.0.0:9051

  db:
    image: postgres:16-alpine
    container_name: onet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ${DB_PASSWORD:?database password must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  scraper:
    build: .
    container_name: onet-scraper
    depends_on:
      - tor
      - db
    environment:
      - TOR_PROXY=socks5://tor:9050
      - TOR_CONTROL_PORT=9051
      - TOR_ENABLED=true
      - DATABASE_URL=postgresql://scraper:${DB_PASSWORD:?database password must be set in .env}@db:5432/scraper
    volumes:
      - ./logs:/app/logs
    command: python -m scrapy crawl onet

volumes:
  pgdata:


